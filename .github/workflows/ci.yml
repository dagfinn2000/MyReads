name: CI

# Runs the project's checks on every push and pull request. This is
# tooling only — it executes in GitHub's cloud and never ships with the app.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    # The database-backed tests talk to a real Postgres. A service container
    # is faster than starting one from the test harness and uses the same
    # image the app ships against.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: myreads
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: myreads_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U myreads -d myreads_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22" # newest 22.x; README asks for Node 22.13 or newer
          cache: npm

      - name: Install dependencies
        run: npm ci

      # tsc and the build both need the generated Prisma client, which no
      # postinstall hook produces — so generate it explicitly first.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      # Restore, the export round trip, and the ownership checks — the paths
      # where a fake database would reproduce the bug rather than catch it.
      # DATABASE_URL is set, so the harness uses the service container above
      # instead of starting its own.
      - name: Database tests
        run: npx prisma migrate deploy && npm run test:db
        env:
          DATABASE_URL: postgresql://myreads:ci@localhost:5432/myreads_test
          COVERS_DIR: /tmp/ci-covers

      # A production build catches breakage the unit tests can't. The pages
      # are all force-dynamic, so this needs no database — the dummy values
      # below only satisfy env look-ups at build time, never a connection.
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          AUTH_SECRET: ci-dummy-secret-not-used-at-build
          AUTH_TRUST_HOST: "true"

  # The deploy path the README gives (`docker compose up -d --build`), which
  # the checks above never touch: build the image, start it against a fresh
  # database the way docker-compose.yml does, and wait for both services to
  # report healthy. A broken Dockerfile, a migration that fails on an empty
  # database or a server that won't start turns this red before it reaches
  # anyone's server.
  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Build and start with Docker Compose
        run: docker compose up --build --detach --wait --wait-timeout 300
        env:
          POSTGRES_PASSWORD: ci
          AUTH_SECRET: ci-secret-for-the-compose-check

      - name: Sign-in page answers
        run: curl --fail --silent --show-error --output /dev/null http://localhost:3000/login

      # The sign-in page needs no database; making an account does, through
      # the same Prisma client every page uses.
      - name: The app reaches its database
        run: >-
          curl --fail --silent --show-error --output /dev/null
          -H 'Content-Type: application/json'
          -d '{"username":"ci-check","password":"ci-check-password-123"}'
          http://localhost:3000/api/register

      # The entrypoint runs this on every start but never stops for it, so
      # a script that can't load or reach the database only shows up here.
      - name: Housekeeping scripts run in the image
        run: docker compose exec -T app node scripts/prune-metadata-cache.mjs | grep 'pruned'
        env:
          POSTGRES_PASSWORD: ci
          AUTH_SECRET: ci-secret-for-the-compose-check

      - name: Container logs
        if: failure()
        run: docker compose logs
        env:
          POSTGRES_PASSWORD: ci
          AUTH_SECRET: ci-secret-for-the-compose-check
